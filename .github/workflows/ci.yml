# CI for Contoso Orders.
#
# Two jobs, in order:
#   1. build-and-test  – compile and run the tests (the check protect-main requires)
#   2. image           – build the container image from the SAME commit, tag it with
#                        the Git SHA, and (only on main) push it to GitHub Container
#                        Registry. On a pull request the image is built but not pushed,
#                        so a broken Dockerfile fails the PR.
#
# "Build once, promote the same artefact": the image pushed here is the only thing
# that gets deployed later (3.3). Nothing is rebuilt per environment.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The token GitHub hands the workflow gets only what each job asks for.
permissions:
  contents: read

env:
  # ghcr.io/<owner>/<repo>, e.g. ghcr.io/app-teck/contoso-orders (lower-cased below)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # to publish the test report on the PR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: contoso-orders-jar
          path: target/*.jar
          retention-days: 7

  image:
    name: Container image
    needs: build-and-test              # never build an image from a commit whose tests failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                  # push to ghcr.io
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # Work out the tags from the Git context. Pushing to main produces:
      #   ghcr.io/app-teck/contoso-orders:<7-char sha>   (immutable: this exact commit)
      #   ghcr.io/app-teck/contoso-orders:latest         (moving: newest main)
      # A pull request produces a pr-<number> tag, used for the build only.
      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in with the workflow's own token. No personal secret is stored anywhere.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Dockerfile. push is true only for a push to main; on a PR this
      # just proves the Dockerfile still builds. Layers are cached in GitHub's
      # Actions cache so the Maven dependency layer is reused between runs.
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Pushed. Digest: \`${{ steps.build.outputs.digest }}\`"
            else
              echo "Built only (pull request). Not pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
