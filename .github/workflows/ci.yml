name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: contoso-orders-jar
          path: target/*.jar
          retention-days: 7
